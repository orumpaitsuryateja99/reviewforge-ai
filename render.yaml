services:
  - type: keyvalue
    name: reviewforge-cache-orumpati
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: reviewforge-api-orumpati
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: reviewforge-db-orumpati
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reviewforge-db-orumpati
          property: port
      - key: DB_NAME
        fromDatabase:
          name: reviewforge-db-orumpati
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: reviewforge-db-orumpati
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reviewforge-db-orumpati
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: reviewforge-cache-orumpati
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: reviewforge-cache-orumpati
          property: port
      - key: REDIS_TIMEOUT
        value: 5s
      - key: APP_ALLOWED_ORIGINS
        value: https://reviewforge-ai-orumpati.onrender.com
      - key: FRONTEND_URL
        value: https://reviewforge-ai-orumpati.onrender.com
      - key: GITHUB_OAUTH_CALLBACK_URL
        value: https://reviewforge-ai-orumpati.onrender.com/api/platform/auth/github/callback
      - key: GITHUB_SETUP_CALLBACK_URL
        value: https://reviewforge-ai-orumpati.onrender.com/api/platform/github/installations/callback
      - key: GITHUB_API_VERSION
        value: 2026-03-10
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RUNNER_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_EFFORT
        value: HIGH
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: reviewforge-ai-orumpati
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/platform/health
    envVars:
      # Free web services cannot receive private-network traffic, so the server-side
      # Next.js proxy reaches the API through its TLS endpoint.
      - key: BACKEND_INTERNAL_URL
        value: https://reviewforge-api-orumpati.onrender.com

databases:
  - name: reviewforge-db-orumpati
    plan: free
    region: ohio
    databaseName: reviewforge
    user: reviewforge
    ipAllowList: []
